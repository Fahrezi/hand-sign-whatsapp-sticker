<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hand Sign Recognition</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: #111; color: #eee; text-align: center; margin: 0; padding: 20px; }
  h1 { font-size: 1.3rem; }
  #container { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4 / 3; margin: 0 auto; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; transform: scaleX(-1); }
  #status { margin-top: 12px; font-size: 1rem; min-height: 1.5em; color: #9f9; }
  #result { min-height: 130px; display: flex; align-items: center; justify-content: center; }
  #result img { max-height: 120px; max-width: 100%; border-radius: 8px; background: #222; }
  #score { font-size: 1rem; color: #9f9; }
  button { margin-top: 10px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  #signList { margin-top: 24px; }
  #signList h2 { font-size: 1rem; color: #aaa; font-weight: normal; }
  #signGrid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sign-tag { padding: 4px 10px; font-size: 0.85rem; color: #ccc; background: #222; border: 1px solid #333; border-radius: 14px; text-transform: capitalize; }

  @media (max-width: 480px) {
    body { padding: 12px; }
    h1 { font-size: 1.1rem; }
    button { width: 100%; padding: 12px; font-size: 1.05rem; }
    #result img { max-height: 90px; }
  }
</style>
</head>
<body>

<h1>Hand Sign Sticker</h1>
<div id="container">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
</div>
<div id="status">Loading model...</div>
<div id="result"><img id="resultImg" src="images/default.png" alt="sign"></div>
<div id="score"></div>
<button id="startBtn">Start Camera</button>

<div id="signList">
  <h2>Available Signs</h2>
  <div id="signGrid"></div>
</div>

<script type="module">
import {
  GestureRecognizer,
  FilesetResolver,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

import { HAND_SIGN_CLASSES, score } from "./models/model.js";

const video = document.getElementById("webcam");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const resultImg = document.getElementById("resultImg");
const scoreEl = document.getElementById("score");
const startBtn = document.getElementById("startBtn");

const DEFAULT_IMAGE = "images/default.png";
const CUSTOM_CONFIDENCE_THRESHOLD = 0.7;
const GESTURE_IMAGES = {
  "Closed_Fist": "images/close-fist.png",
  "Pointing_Up": "images/pointing-up.png"
};
const SIGN_IMAGES = {
  "give": "images/give.png",
  "izien": "images/izien.png",
  "mikier": "images/mikier.png"
};

function setImage(imgEl, src) {
  if (imgEl.getAttribute("src") !== src) imgEl.src = src;
}

function renderSignList() {
  const grid = document.getElementById("signGrid");
  const entries = [
    ...Object.entries(SIGN_IMAGES),
    ...Object.entries(GESTURE_IMAGES)
  ];
  grid.innerHTML = entries.map(([label]) => `
    <span class="sign-tag">${label.replace(/_/g, " ")}</span>
  `).join("");
}
renderSignList();

let gestureRecognizer;
let running = false;

// wrist-relative landmark coords, flattened x,y,z, scaled to [-1,1] by max abs
function preprocessLandmarks(landmarks) {
  const wrist = landmarks[0];
  const flat = [];
  for (const p of landmarks) {
    flat.push(p.x - wrist.x, p.y - wrist.y, p.z - wrist.z);
  }
  const maxAbs = Math.max(...flat.map(Math.abs)) || 1;
  return flat.map(v => v / maxAbs);
}

function classifyCustomSign(landmarks) {
  const input = preprocessLandmarks(landmarks);
  const probs = score(input);
  let bestIdx = 0;
  for (let i = 1; i < probs.length; i++) {
    if (probs[i] > probs[bestIdx]) bestIdx = i;
  }
  return { label: HAND_SIGN_CLASSES[bestIdx], score: probs[bestIdx] };
}

async function createRecognizer() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2
  });
  statusEl.textContent = "Model ready. Click Start Camera.";
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  await new Promise(r => (video.onloadedmetadata = r));
  video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  running = true;
  predictLoop();
}

function predictLoop() {
  if (!running) return;
  try {
    const nowMs = performance.now();
    const results = gestureRecognizer.recognizeForVideo(video, nowMs);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const drawingUtils = new DrawingUtils(ctx);

    if (results.landmarks && results.landmarks.length > 0) {
      for (const landmarks of results.landmarks) {
        drawingUtils.drawConnectors(landmarks, GestureRecognizer.HAND_CONNECTIONS, { color: "#00FF00", lineWidth: 3 });
        drawingUtils.drawLandmarks(landmarks, { color: "#FF0000", lineWidth: 1, radius: 3 });
      }
    }

    if (results.landmarks && results.landmarks.length > 0) {
      const custom = classifyCustomSign(results.landmarks[0]);
      if (custom.score >= CUSTOM_CONFIDENCE_THRESHOLD) {
        setImage(resultImg, SIGN_IMAGES[custom.label] || DEFAULT_IMAGE);
        scoreEl.textContent = `${custom.label} — ${(custom.score * 100).toFixed(1)}%`;
      } else if (results.gestures && results.gestures.length > 0 && results.gestures[0][0].categoryName !== "None") {
        const top = results.gestures[0][0];
        setImage(resultImg, GESTURE_IMAGES[top.categoryName] || DEFAULT_IMAGE);
        scoreEl.textContent = `${top.categoryName} — ${(top.score * 100).toFixed(1)}%`;
      } else {
        setImage(resultImg, DEFAULT_IMAGE);
        scoreEl.textContent = "No sign match";
      }
    } else {
      setImage(resultImg, DEFAULT_IMAGE);
      scoreEl.textContent = "No hand detected";
    }
  } catch (err) {
    console.error("predictLoop error:", err);
  } finally {
    requestAnimationFrame(predictLoop);
  }
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  startBtn.textContent = "Starting...";
  try {
    if (!gestureRecognizer) await createRecognizer();
    await startCamera();
    startBtn.style.display = "none";
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    startBtn.disabled = false;
    startBtn.textContent = "Start Camera";
  }
});

createRecognizer();
</script>

</body>
</html>
