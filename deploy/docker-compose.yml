# hand-sign API on the VPS. HTTPS and routing are done by the shared Caddy in deploy/proxy,
# which reaches this container as `hand-sign-api` on the external `web` network.
# Database is Supabase, uploads go to R2 — nothing stateful runs here.
#
#   cd deploy
#   docker compose run --rm migrate      # apply Prisma migrations
#   docker compose up -d --build         # build + start
name: hand-sign

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: hand-sign-api
    restart: unless-stopped
    env_file: api.env
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Caddy is one proxy hop in front
      TRUST_PROXY: '1'
      NODE_OPTIONS: --max-old-space-size=320
    mem_limit: 448m
    # no `ports:` — only reachable by Caddy
    networks:
      web:
        # must be unique across all projects on the `web` network
        aliases: [hand-sign-api]

  # One-off: docker compose run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    image: hand-sign-api-migrate
    profiles: [migrate]
    env_file: api.env
    working_dir: /app/apps/api
    command: npx prisma migrate deploy

networks:
  web:
    external: true
